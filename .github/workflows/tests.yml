name: Check lesson tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Runs every lesson's tests against its solutions.py
      # to make sure the tests and answers agree.
      - run: CHECK_SOLUTIONS=1 pytest
